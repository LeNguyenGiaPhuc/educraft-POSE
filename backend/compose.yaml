services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: educraft
      POSTGRES_USER: educraft
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - educraft_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educraft -d educraft"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  educraft_pg_data:
